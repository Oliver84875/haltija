    <script>
        // Catalog Products Data
        let products = [];

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) {
                    throw new Error(`Failed to load products.json: ${response.status}`);
                }

                products = await response.json();
                renderCatalog(products);
                if (Object.keys(quoteSelection).length > 0 || cart.length > 0) {
                    renderQuoteProducts();
                }
                updateCartUI();
            } catch (error) {
                console.error(error);
                const container = document.getElementById('product-grid');
                if (container) {
                    container.innerHTML = `
                        <div class="col-span-full rounded border border-red-500/40 bg-red-500/5 p-6 text-center text-red-300">
                            <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
                            <p class="font-tactical text-sm uppercase">Catalog failed to load</p>
                            <p class="text-xs mt-2 text-slate-300">Check that <strong>products.json</strong> exists in the site root and is valid JSON.</p>
                        </div>
                    `;
                }
            }
        }

        const PLACEHOLDER = id => `https://placehold.co/400x300/1e2421/8da832?text=${encodeURIComponent(id)}`;
        const findProduct = id => products.find(p => p.id === id);

        // Loadout is saved in the browser so it survives page reloads
        let cart = [];
        try {
            cart = (JSON.parse(localStorage.getItem('haltija-loadout')) || []).filter(c => findProduct(c.id));
        } catch (e) {
            cart = [];
        }

        // Selected products in the quote form: { [id]: { qty, variant } }
        let quoteSelection = {};

        // Initialize Catalog View
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            updateCartUI();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeQuoteModal();
                closeProductModal();
                toggleCartDrawer(false);
            }
        });

        // Render Catalog Grid Cards
        function renderCatalog(items) {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-tactical-card border border-tactical-border rounded-lg overflow-hidden flex flex-col justify-between hover:border-tactical-highlight transition-all hud-border';

                card.innerHTML = `
                    <div>
                        <div class="relative bg-white overflow-hidden h-56 flex items-center justify-center p-2 cursor-pointer" onclick="openProductModal('${item.id}')">
                            <span class="absolute top-2 left-2 z-10 bg-tactical-black/80 px-2 py-0.5 text-[10px] font-tactical text-tactical-highlight border border-tactical-border">
                                ${item.id}
                            </span>
                            ${item.images.length > 1 ? `<span class="absolute top-2 right-2 z-10 bg-tactical-black/80 px-2 py-0.5 text-[10px] font-tactical text-slate-300 border border-tactical-border">MULTI-VIEW</span>` : ''}
                            <img src="${item.images[0]}" onerror="this.src='${PLACEHOLDER(item.id)}'" alt="${item.name}" loading="lazy" class="max-h-full object-contain group-hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="p-4">
                            <div class="text-[10px] font-tactical text-tactical-tan uppercase mb-1">${item.pattern || 'TACTICAL GEAR'}</div>
                            <h3 class="font-tactical text-white font-bold text-base leading-snug mb-2">${item.name}</h3>
                            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${item.shortDesc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 font-tactical space-y-2">
                        <div class="flex gap-2">
                            <button onclick="openProductModal('${item.id}')" class="flex-1 py-2 bg-tactical-dark hover:bg-tactical-border text-white text-xs font-semibold rounded border border-tactical-border transition-colors">
                                SPECS
                            </button>
                            <button onclick="addToCart('${item.id}')" class="px-3 py-2 bg-tactical-olive hover:bg-tactical-accent text-white text-xs font-semibold rounded transition-colors flex items-center justify-center">
                                <i class="fa-solid fa-plus"></i> LOAD
                            </button>
                        </div>
                        <button onclick="openQuoteModal(['${item.id}'])" class="w-full py-2 bg-tactical-highlight/10 hover:bg-tactical-highlight hover:text-tactical-black text-tactical-highlight border border-tactical-highlight/50 rounded text-xs font-bold uppercase transition-all">
                            <i class="fa-solid fa-file-signature"></i> REQUEST QUOTE
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filter Functionality
        function filterCatalog(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-4 py-2 bg-tactical-card hover:bg-tactical-border text-slate-300 rounded transition-all border border-tactical-border';
            });

            const activeBtn = document.getElementById(`filter-${category}`);
            if (activeBtn) {
                activeBtn.className = 'filter-btn px-4 py-2 bg-tactical-highlight text-tactical-black font-bold rounded transition-all';
            }

            if (category === 'all') {
                renderCatalog(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderCatalog(filtered);
            }
        }

        // Open Modal Details
        function openProductModal(productId) {
            const item = findProduct(productId);
            if (!item) return;

            const modal = document.getElementById('product-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <div class="bg-white rounded border border-tactical-border p-2 mb-3">
                            <img id="modal-main-image" src="${item.images[0]}" onerror="this.src='${PLACEHOLDER(item.id)}'" alt="${item.name}" class="w-full h-72 object-contain">
                        </div>
                        ${item.images.length > 1 ? `
                            <div class="text-xs font-tactical text-tactical-gray mb-1">MORE VIEWS:</div>
                            <div class="grid grid-cols-4 gap-2">
                                ${item.images.map((src, i) => `
                                    <button onclick="setModalImage('${src}', this)" class="modal-thumb bg-white rounded border-2 ${i === 0 ? 'border-tactical-highlight' : 'border-tactical-border'} p-1">
                                        <img src="${src}" alt="${item.name} view ${i + 1}" class="w-full h-16 object-contain">
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="space-y-4 font-tactical">
                        <div>
                            <span class="bg-tactical-olive px-2 py-0.5 text-xs font-bold text-white uppercase">${item.id}</span>
                            <h2 class="text-2xl font-bold text-white uppercase mt-1">${item.name}</h2>
                            <p class="text-xs text-tactical-highlight mt-0.5">${item.material}${item.weight ? ` • ${item.weight}` : ''}</p>
                        </div>

                        <div class="text-xs text-slate-300 leading-relaxed">
                            ${item.shortDesc}
                        </div>

                        ${item.variants ? `
                            <div class="border-t border-b border-tactical-border py-3 space-y-2">
                                <div class="text-xs text-tactical-tan font-bold uppercase">AVAILABLE CONFIGURATIONS:</div>
                                ${item.variants.map(v => `
                                    <div class="flex justify-between text-xs bg-tactical-black p-2 rounded border border-tactical-border">
                                        <span class="text-white font-semibold">${v.type}</span>
                                        <span class="text-tactical-gray">${v.size} (${v.weight})</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        <div>
                            <h4 class="text-xs font-bold text-white uppercase mb-2">TECHNICAL FEATURES:</h4>
                            <ul class="space-y-1.5 text-xs text-slate-300">
                                ${item.features.map(f => `
                                    <li class="flex items-start gap-2">
                                        <i class="fa-solid fa-check text-tactical-highlight mt-0.5"></i>
                                        <span>${f}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <div class="pt-4 flex flex-col sm:flex-row gap-3">
                            <button onclick="closeProductModal(); openQuoteModal(['${item.id}']);" class="flex-1 py-3 bg-tactical-highlight hover:bg-tactical-accent text-tactical-black font-bold text-xs uppercase rounded transition-colors">
                                <i class="fa-solid fa-file-signature"></i> REQUEST QUOTE
                            </button>
                            <button onclick="addToCart('${item.id}'); closeProductModal();" class="flex-1 py-3 bg-tactical-olive hover:bg-tactical-accent text-white font-bold text-xs uppercase rounded transition-colors">
                                <i class="fa-solid fa-plus"></i> ADD TO LOADOUT
                            </button>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function setModalImage(src, thumb) {
            document.getElementById('modal-main-image').src = src;
            document.querySelectorAll('.modal-thumb').forEach(t => {
                t.classList.remove('border-tactical-highlight');
                t.classList.add('border-tactical-border');
            });
            thumb.classList.remove('border-tactical-border');
            thumb.classList.add('border-tactical-highlight');
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Cart Loadout Management
        function saveCart() {
            try {
                localStorage.setItem('haltija-loadout', JSON.stringify(cart.map(c => ({ id: c.id, qty: c.qty }))));
            } catch (e) { /* storage unavailable */ }
        }

        function addToCart(productId) {
            if (!findProduct(productId)) return;

            const existing = cart.find(c => c.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ id: productId, qty: 1 });
            }

            updateCartUI();
            toggleCartDrawer(true);
        }

        function changeCartQty(productId, delta) {
            const entry = cart.find(c => c.id === productId);
            if (!entry) return;
            entry.qty = Math.max(1, entry.qty + delta);
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(c => c.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            saveCart();
            const cartContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const totalQty = document.getElementById('cart-total-qty');

            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCount.textContent = total;
            totalQty.textContent = total;

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="text-center py-12 text-tactical-gray">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-xs">NO ITEMS IN LOADOUT</p>
                        <p class="text-[10px] mt-1">Press "LOAD" on a product to add it here.</p>
                    </div>
                `;
                return;
            }

            cartContainer.innerHTML = cart.map(entry => {
                const item = findProduct(entry.id);
                return `
                <div class="bg-tactical-black p-3 rounded border border-tactical-border flex gap-3 items-center">
                    <img src="${item.images[0]}" alt="" class="w-14 h-14 object-contain bg-white rounded">
                    <div class="flex-grow min-w-0">
                        <div class="text-xs text-tactical-highlight font-bold">${item.id}</div>
                        <div class="text-xs text-white font-semibold leading-tight truncate">${item.name}</div>
                        <div class="mt-1.5 inline-flex items-center border border-tactical-border rounded">
                            <button onclick="changeCartQty('${item.id}', -1)" class="px-2 py-0.5 text-slate-300 hover:text-white" aria-label="Decrease quantity"><i class="fa-solid fa-minus text-[10px]"></i></button>
                            <span class="px-2 text-xs text-white">${entry.qty}</span>
                            <button onclick="changeCartQty('${item.id}', 1)" class="px-2 py-0.5 text-slate-300 hover:text-white" aria-label="Increase quantity"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-slate-500 hover:text-red-400 p-1" aria-label="Remove">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            `;
            }).join('');
        }

        function toggleCartDrawer(open) {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('cart-overlay');
            if (typeof open !== 'boolean') {
                open = drawer.classList.contains('translate-x-full');
            }
            drawer.classList.toggle('translate-x-full', !open);
            overlay.classList.toggle('hidden', !open);
        }

        function quoteFromCart() {
            toggleCartDrawer(false);
            const selection = {};
            cart.forEach(c => { selection[c.id] = { qty: c.qty, variant: '' }; });
            openQuoteModal(null, selection);
        }

        function toggleMobileMenu(open) {
            const menu = document.getElementById('mobile-menu');
            if (typeof open !== 'boolean') open = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !open);
        }

        // Quote Request Modal
        function openQuoteModal(productIds, selection) {
            if (selection) {
                quoteSelection = selection;
            } else if (productIds && productIds.length) {
                quoteSelection = {};
                productIds.forEach(id => { quoteSelection[id] = { qty: 1, variant: '' }; });
            } else if (Object.keys(quoteSelection).length === 0 && cart.length) {
                cart.forEach(c => { quoteSelection[c.id] = { qty: c.qty, variant: '' }; });
            }

            document.getElementById('quote-form-view').classList.remove('hidden');
            document.getElementById('quote-success-view').classList.add('hidden');
            document.getElementById('quote-product-error').classList.add('hidden');
            renderQuoteProducts();

            const modal = document.getElementById('quote-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeQuoteModal() {
            const modal = document.getElementById('quote-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderQuoteProducts() {
            const list = document.getElementById('quote-product-list');
            list.innerHTML = products.map(item => {
                const sel = quoteSelection[item.id];
                const checked = Boolean(sel);
                return `
                <div class="rounded border ${checked ? 'border-tactical-highlight bg-tactical-olive/10' : 'border-tactical-border bg-tactical-black'} p-2.5 flex flex-wrap items-center gap-3 transition-colors">
                    <label class="flex items-center gap-3 flex-grow min-w-[200px] cursor-pointer">
                        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleQuoteProduct('${item.id}', this.checked)" class="w-4 h-4 accent-[#8da832]">
                        <img src="${item.images[0]}" alt="" class="w-12 h-12 object-contain bg-white rounded">
                        <span>
                            <span class="block text-[10px] text-tactical-highlight font-bold">${item.id}</span>
                            <span class="block text-xs text-white font-semibold leading-tight">${item.name}</span>
                        </span>
                    </label>
                    <div class="inline-flex items-center border border-tactical-border rounded bg-tactical-black">
                        <button type="button" onclick="adjustQuoteQty('${item.id}', -1)" class="px-2 py-1 text-slate-300 hover:text-white" aria-label="Decrease quantity"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <span class="min-w-[32px] text-center text-xs text-white font-semibold">${sel ? sel.qty : 1}</span>
                        <button type="button" onclick="adjustQuoteQty('${item.id}', 1)" class="px-2 py-1 text-slate-300 hover:text-white" aria-label="Increase quantity"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    </div>
                </div>
            `;
            }).join('');
        }

        function toggleQuoteProduct(id, checked) {
            if (checked) {
                quoteSelection[id] = { qty: 1, variant: '' };
            } else {
                delete quoteSelection[id];
            }
            renderQuoteProducts();
        }

        function adjustQuoteQty(id, delta) {
            if (!quoteSelection[id]) {
                quoteSelection[id] = { qty: 1, variant: '' };
            }
            quoteSelection[id].qty = Math.max(1, quoteSelection[id].qty + delta);
            renderQuoteProducts();
        }

        function handleQuoteSubmit(event) {
            event.preventDefault();
            const selected = Object.entries(quoteSelection).map(([id, value]) => ({ id, qty: value.qty }));
            if (!selected.length) {
                document.getElementById('quote-product-error').classList.remove('hidden');
                return;
            }

            document.getElementById('quote-products-field').value = JSON.stringify(selected);
            document.getElementById('quote-total-field').value = String(selected.reduce((sum, item) => sum + item.qty, 0));

            const form = event.target;
            const formData = new FormData(form);
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> SENDING...';

            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                document.getElementById('quote-form-view').classList.add('hidden');
                document.getElementById('quote-success-view').classList.remove('hidden');
            })
            .catch(() => {
                showToast('Unable to send request right now. Please email sales@haltijatactical.com.', 'error');
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>SEND QUOTE REQUEST</span>';
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-4 py-3 rounded border font-tactical text-xs shadow-2xl ${type === 'error' ? 'bg-red-500/20 border-red-400 text-red-200' : 'bg-tactical-olive/20 border-tactical-highlight text-tactical-highlight'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2800);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'SENDING...';

            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(new FormData(form)).toString()
            })
            .then(() => {
                form.reset();
                showToast('Inquiry sent successfully.');
            })
            .catch(() => {
                showToast('Failed to send inquiry. Try again or email sales@haltijatactical.com.', 'error');
            })
            .finally(() => {
                button.disabled = false;
                button.textContent = 'SEND OFFICIAL INQUIRY';
            });
        }
    </script>
